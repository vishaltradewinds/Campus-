name: NexusTalent Production Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit regression tests
        run: npm test
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Firestore/Auth emulator authorization tests
        run: firebase emulators:exec --only auth,firestore "npm run test:firestore"
      - name: Build
        run: npm run build
      - name: Smoke start
        run: |
          NODE_ENV=production PORT=8080 node dist/server.cjs > /tmp/nexustalent-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexustalent-server.log
          exit 1
