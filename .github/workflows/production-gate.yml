name: NexusTalent Production Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-owner-ci
          POSTGRES_DB: nexustalent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexustalent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      - name: Install Firestore rules test harness
        run: npm install --no-save @firebase/rules-unit-testing@5.0.2
      - name: Typecheck
        run: npm run lint
      - name: Matching regression tests
        run: npm test -- tests/matching.test.ts
      - name: Trusted backend regression tests
        run: npm test -- tests/trustedBackend.test.ts
      - name: Commercial regression tests
        run: npm test -- tests/commercial.test.ts
      - name: PostgreSQL migration and restricted-runtime transaction acceptance
        env:
          PGPASSWORD: synthetic-owner-ci
        run: |
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/001_foundation.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/foundation.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/import_rehearsal.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/ci_runtime.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/002_scoped_reader.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/scoped_reader_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/scoped_reader_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/003_registration_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/registration_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/registration_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/004_demand_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/demand_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/demand_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/005_institution_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/institution_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/institution_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/006_consent_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/consent_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/consent_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/007_assessment_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/assessment_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/assessment_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/008_offer_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/offer_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/offer_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/009_joining_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/joining_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/joining_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/010_verification_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/verification_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/verification_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/011_academic_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/academic_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/academic_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/012_evidence_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/evidence_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/evidence_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/013_disclosure_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/disclosure_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/disclosure_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/014_profile_writer.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/profile_writer_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/profile_writer_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/015_registration_directory.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/directory_reader_ci.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/directory_reader_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/016_session_identity.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/session_identity.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/017_login_credentials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/login_credentials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/018_controlled_enrollment.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/controlled_enrollment.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/migrations/019_student_offer_reader.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f db/neon/tests/student_offer_reader_denials.sql
          psql -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -1 -f db/neon/tests/auth_http_ci.sql
          NODE_ENV=test NEXUSTALENT_STANDALONE_AUTH_TEST=1 NEXUSTALENT_AUTH_PG_CI=1 NEXUSTALENT_AUTH_OWNER_CI_URL=postgresql://postgres:synthetic-owner-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_LOGIN_CI_URL=postgresql://nexustalent_login_ci:synthetic-login-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_READER_CI_URL=postgresql://nexustalent_session_ci:synthetic-session-ci@127.0.0.1:5432/nexustalent_ci ./node_modules/.bin/tsx --test tests/postgresAuthHttpIntegration.test.ts
          NODE_ENV=test NEXUSTALENT_STANDALONE_AUTH_TEST=1 NEXUSTALENT_AUTH_PG_CI=1 NEXUSTALENT_AUTH_OWNER_CI_URL=postgresql://postgres:synthetic-owner-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_LOGIN_CI_URL=postgresql://nexustalent_login_ci:synthetic-login-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_READER_CI_URL=postgresql://nexustalent_session_ci:synthetic-session-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DIRECTORY_URL=postgresql://nexustalent_directory_ci:synthetic-directory-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_PROFILE_URL=postgresql://nexustalent_profile_ci:synthetic-profile-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DISCLOSURE_URL=postgresql://nexustalent_disclosure_ci:synthetic-disclosure-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_EVIDENCE_URL=postgresql://nexustalent_evidence_ci:synthetic-evidence-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_ACADEMIC_URL=postgresql://nexustalent_academic_ci:synthetic-academic-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_VERIFICATION_URL=postgresql://nexustalent_verification_ci:synthetic-verification-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_JOINING_URL=postgresql://nexustalent_joining_ci:synthetic-joining-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_OFFER_URL=postgresql://nexustalent_offer_ci:synthetic-offer-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_ASSESSMENT_URL=postgresql://nexustalent_assessment_ci:synthetic-assessment-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_CONSENT_URL=postgresql://nexustalent_consent_ci:synthetic-consent-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_INSTITUTION_URL=postgresql://nexustalent_institution_ci:synthetic-institution-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DEMAND_URL=postgresql://nexustalent_demand_ci:synthetic-demand-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_REGISTRAR_URL=postgresql://nexustalent_registrar_ci:synthetic-registrar-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_READER_URL=postgresql://nexustalent_reader_ci:synthetic-reader-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_DATASTORE=postgres NEXUSTALENT_PG_INTEGRATION=1 NEXUSTALENT_TEST_DATABASE_URL=postgresql://nexustalent_runtime_ci:synthetic-ci-only@127.0.0.1:5432/nexustalent_ci ./node_modules/.bin/tsx --test tests/postgresIntegration.test.ts
      - name: Read-only PostgreSQL16 role audit SQL compilation (disposable)
        env:
          PGPASSWORD: synthetic-owner-ci
        run: |
          set -euo pipefail
          # Execute only the catalog SELECT on the disposable CI database.
          # Real Neon remains unchanged; login-role provisioning is separately blocked.
          node scripts/audit-production-pg-privileges.mjs > /tmp/nexustalent-role-catalog.sql
          audit_rows=$(psql -X -q -t -A -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -f /tmp/nexustalent-role-catalog.sql)
          test "$(printf '%s\n' "$audit_rows" | wc -l | tr -d ' ')" -eq 17
          existing_app_roles=$(psql -X -q -t -A -h 127.0.0.1 -U postgres -d nexustalent_ci -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_roles WHERE rolname LIKE 'nexustalent_app_%'")
          test "$existing_app_roles" -eq 0
          rm -f /tmp/nexustalent-role-catalog.sql
      - name: Install browser tools for PostgreSQL acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npm exec -- playwright install --with-deps chromium
      - name: Real PostgreSQL HTTPS browser acceptance
        run: NODE_ENV=test NEXUSTALENT_STANDALONE_AUTH_TEST=1 NEXUSTALENT_AUTH_PG_CI=1 NEXUSTALENT_AUTH_OWNER_CI_URL=postgresql://postgres:synthetic-owner-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_LOGIN_CI_URL=postgresql://nexustalent_login_ci:synthetic-login-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_ENROLLMENT_CI_URL=postgresql://nexustalent_enrollment_ci:synthetic-enrollment-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_AUTH_READER_CI_URL=postgresql://nexustalent_session_ci:synthetic-session-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DIRECTORY_URL=postgresql://nexustalent_directory_ci:synthetic-directory-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_PROFILE_URL=postgresql://nexustalent_profile_ci:synthetic-profile-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DISCLOSURE_URL=postgresql://nexustalent_disclosure_ci:synthetic-disclosure-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_EVIDENCE_URL=postgresql://nexustalent_evidence_ci:synthetic-evidence-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_ACADEMIC_URL=postgresql://nexustalent_academic_ci:synthetic-academic-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_VERIFICATION_URL=postgresql://nexustalent_verification_ci:synthetic-verification-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_JOINING_URL=postgresql://nexustalent_joining_ci:synthetic-joining-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_OFFER_URL=postgresql://nexustalent_offer_ci:synthetic-offer-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_ASSESSMENT_URL=postgresql://nexustalent_assessment_ci:synthetic-assessment-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_CONSENT_URL=postgresql://nexustalent_consent_ci:synthetic-consent-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_INSTITUTION_URL=postgresql://nexustalent_institution_ci:synthetic-institution-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_DEMAND_URL=postgresql://nexustalent_demand_ci:synthetic-demand-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_REGISTRAR_URL=postgresql://nexustalent_registrar_ci:synthetic-registrar-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_TEST_READER_URL=postgresql://nexustalent_reader_ci:synthetic-reader-ci@127.0.0.1:5432/nexustalent_ci NEXUSTALENT_DATASTORE=postgres NEXUSTALENT_PG_INTEGRATION=1 NEXUSTALENT_TEST_DATABASE_URL=postgresql://nexustalent_runtime_ci:synthetic-ci-only@127.0.0.1:5432/nexustalent_ci timeout --kill-after=10s 660s node --import tsx tests/standaloneBrowserAcceptance.mjs
      - name: Firebase release-target preflight regression
        run: node --test tests/firebaseTarget.test.mjs tests/runtimeEnvironment.test.mjs
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Firestore/Auth emulator authorization tests
        run: firebase emulators:exec --only auth,firestore "npm run test:firestore"
      - name: Build
        run: npm run build
      - name: Mobile initial download budget
        run: npm run check:mobile-bundle
      - name: Bundled runtime environment regression
        run: NEXUSTALENT_TEST_BUILT_RUNTIME=1 node --test tests/runtimeEnvironment.test.mjs
      - name: Smoke start
        run: |
          NODE_ENV=production PORT=8080 node dist/server.mjs > /tmp/nexustalent-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              # Exercise the real Express middleware in the built application.
              curl --silent --show-error --dump-header /tmp/nexustalent-headers.txt --output /dev/null -H 'x-forwarded-proto: https' http://127.0.0.1:8080/
              grep -Eiq '^X-Content-Type-Options:.*nosniff' /tmp/nexustalent-headers.txt
              grep -Eiq '^Referrer-Policy:.*strict-origin-when-cross-origin' /tmp/nexustalent-headers.txt
              grep -Eiq '^X-Frame-Options:.*DENY' /tmp/nexustalent-headers.txt
              grep -Eiq '^Strict-Transport-Security:.*max-age=31536000' /tmp/nexustalent-headers.txt
              cat /tmp/nexustalent-headers.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexustalent-server.log
          exit 1
      - name: Build production container
        run: docker build --pull -t nexustalent:${GITHUB_SHA} .
      - name: Smoke production container
        run: |
          docker rm -f nexustalent-smoke >/dev/null 2>&1 || true
          docker run -d --name nexustalent-smoke -p 8081:8080 nexustalent:${GITHUB_SHA}
          cleanup() { docker logs nexustalent-smoke || true; docker rm -f nexustalent-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/api/health > /tmp/container-health.json; then
              cat /tmp/container-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs nexustalent-smoke
          docker inspect nexustalent-smoke --format='status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
          exit 1
