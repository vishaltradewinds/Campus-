name: NexusTalent Live Vercel Security Gate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS URL of the exact deployed NexusTalent candidate to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-security-headers:
    name: Verify deployed response headers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Verify the actual deployed HTTP response
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node scripts/check-live-security-headers.mjs
