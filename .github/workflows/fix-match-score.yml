name: Fix Match Score
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace fabricated candidate score
        run: |
          if [[ "${{ github.event.head_commit.message }}" == [automation]* ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/TalentNetworkContext.tsx')
          s=p.read_text()
          old="""        matchScore: 85,\n        matchBreakdown: {\n          skillMatchScore: 94,\n          academicMatchScore: 92,\n          preferenceMatchScore: 95,\n          aiRationale: `${call.institutionName} verified your programming benchmark and invited you for this high-match campus opportunity.`,\n        },"""
          new="""        matchScore: Math.max(0, Math.min(99, candidateMatch?.candidateFitScore || 0)),\n        matchBreakdown: {\n          skillMatchScore: candidateMatch?.matchedSkills.length && campaign?.requirement.requiredSkills.length ? Math.round((candidateMatch.matchedSkills.length / campaign.requirement.requiredSkills.length) * 100) : 0,\n          academicMatchScore: student && campaign?.requirement.graduationYears.includes(student.graduationYear) ? 100 : 0,\n          preferenceMatchScore: candidateMatch?.visibilityDenied ? 0 : 100,\n          aiRationale: candidateMatch?.alignmentPoints?.[0] || 'Candidate activated through institutional workflow; human evaluation required.',\n        },"""
          if old not in s:
              raise SystemExit('expected fabricated score block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/TalentNetworkContext.tsx
          git commit -m "[automation] remove fabricated candidate match score"
          git push
