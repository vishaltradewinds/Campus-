name: Production Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !startsWith(github.event.head_commit.message, '[automation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integrity and privacy hardening
        shell: python
        run: |
          from pathlib import Path

          auth = Path('src/components/auth/AuthScreens.tsx')
          s = auth.read_text()
          replacements = {
              "useState(institutions[0]?.id || 'inst-1')": "useState(institutions[0]?.id || '')",
              "useState('B.Tech')": "useState('')",
              "useState('Computer Science & Engineering')": "useState('')",
              "useState<number>(2027)": "useState<number>(0)",
              "useState<number>(8.5)": "useState<number>(0)",
              "useState<number>(90)": "useState<number>(0)",
              "useState<number>(88)": "useState<number>(0)",
              "useState('Karnataka')": "useState('')",
              "useState('Data Structures & Algorithms, Java, React, SQL')": "useState('')",
              "useState<number>(10)": "useState<number>(0)",
              "useState('Enterprise IT & Next-Gen Software')": "useState('')",
              "useState('Bengaluru, Karnataka')": "useState('')",
              "businessRegNumber: cinOrGstin || 'CIN-U72200KA2020PTC139042',": "businessRegNumber: cinOrGstin || '',",
              "gstinOrCin: cinOrGstin || '29AAACA0102M1Z5',": "gstinOrCin: cinOrGstin || '',",
              "name: institutionName || displayName || (userEmail.split('@')[0] === 'tpo' ? 'Indian Institute of Technology Bombay (IITB)' : userEmail.split('@')[0] + ' Institute'),": "name: institutionName || displayName || userEmail.split('@')[0],",
              "code: aisheCode || `INST-${Date.now().toString().slice(-4)}`,": "code: aisheCode || '',",
              "historicalJoiningRatePercent: 95,": "historicalJoiningRatePercent: 0,",
              "overallRating: 4.9,": "overallRating: 0,",
              "specializations: ['Computer Science & Engineering', 'Information Technology', 'Data Science & AI', 'Electronics & Comm'],": "specializations: [],",
              "totalStudents: totalBatchStudents || 1200,": "totalStudents: totalBatchStudents || 0,",
              "placementSeeking: Math.round((totalBatchStudents || 1200) * 0.9),": "placementSeeking: 0,",
              "verifiedCount: Math.round((totalBatchStudents || 1200) * 0.9),": "verifiedCount: 0,",
              "assessmentReady: Math.round((totalBatchStudents || 1200) * 0.85),": "assessmentReady: 0,",
              "highMatchCount: Math.round((totalBatchStudents || 1200) * 0.65),": "highMatchCount: 0,",
              "institutionId: isIndep ? 'inst-independent' : (selectedInst?.id || 'inst-1'),": "institutionId: isIndep ? '' : (selectedInst?.id || ''),",
              "institutionName: isIndep \n          ? (customCollegeName ? `${customCollegeName} (Direct)` : 'Direct Independent Candidate')\n          : (selectedInst?.name || 'Indian Institute of Technology Bombay (IITB)'),": "institutionName: isIndep \n          ? (customCollegeName ? `${customCollegeName} (Direct)` : '')\n          : (selectedInst?.name || ''),",
              "institutionCode: isIndep ? 'DIRECT-IND' : (selectedInst?.code || 'IITB-MUM'),": "institutionCode: isIndep ? 'DIRECT-IND' : (selectedInst?.code || ''),",
              "state: stateRegion || 'Karnataka',": "state: stateRegion || '',",
              "program: degreeProgram || 'B.Tech',": "program: degreeProgram || '',",
              "branch: branchDiscipline || 'Computer Science & Engineering',": "branch: branchDiscipline || '',",
              "graduationYear: gradYear || 2027,": "graduationYear: gradYear || 0,",
              "cgpa: cgpaScore || 8.5,": "cgpa: cgpaScore || 0,",
              "rollNumber: rollNumber || `23CS${Date.now().toString().slice(-4)}`,": "rollNumber: rollNumber || '',",
              "title: `${branchDiscipline} Capstone & Microservices Project`,": "title: `${branchDiscipline || 'Project'} Portfolio Project`,",
              "description: 'Scalable cloud-hosted engineering software with secure API integrations and responsive user interfaces.',": "description: 'Student-provided project description pending verification.',",
              "technologies: ['TypeScript', 'Java', 'React', 'PostgreSQL', 'Docker'],": "technologies: [],",
              "targetRoles: ['Software Development Engineer (SDE)', 'Full-Stack Developer', 'Backend Engineer'],": "targetRoles: [],",
              "preferredLocations: ['Bengaluru', 'Mumbai', 'Hyderabad', 'Pune', 'Delhi NCR', 'Chennai'],": "preferredLocations: [],",
              "minSalaryLPA: minExpectedLPA || 10,": "minSalaryLPA: minExpectedLPA || 0,",
              "expectedSalaryMinLPA: (minExpectedLPA || 10) + 4,": "expectedSalaryMinLPA: minExpectedLPA || 0,",
              "autoDeclineBelowMinSalary: true": "autoDeclineBelowMinSalary: false",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          email_admin = """        if (!userDocSnap.exists()) {\n          // If this is an authorized admin logging in for the first time\n          const adminEmails = ['admin@nexustalent.os', 'system.admin@nexustalent.os', 'admin@apex.com', 'vkonline99@gmail.com'];\n          if (adminEmails.includes((loggedUser.email || '').toLowerCase())) {\n            await setDoc(userDocRef, {\n              uid: loggedUser.uid,\n              email: loggedUser.email,\n              name: 'System Administrator',\n              role: 'super_admin',\n              createdAt: serverTimestamp(),\n              updatedAt: serverTimestamp()\n            });\n          }\n        }\n"""
          email_safe = """        if (!userDocSnap.exists()) {\n          throw new Error('Account is authenticated but has no provisioned platform role. Contact a platform administrator.');\n        }\n"""
          s = s.replace(email_admin, email_safe)

          google_admin = """      if (!userDocSnap.exists()) {\n        const adminEmails = ['admin@nexustalent.os', 'system.admin@nexustalent.os', 'admin@apex.com', 'vkonline99@gmail.com'];\n        const isSuperAdminEmail = adminEmails.includes((loggedUser.email || '').toLowerCase());\n        const assignedRole: UserRole = isSuperAdminEmail ? 'super_admin' : selectedRoleTab;\n        \n        await initializeUserRecordInDb(\n          loggedUser.uid,\n          loggedUser.email || '',\n          assignedRole,\n          loggedUser.displayName || 'Google User'\n        );\n      }\n"""
          google_safe = """      if (!userDocSnap.exists()) {\n        await initializeUserRecordInDb(\n          loggedUser.uid,\n          loggedUser.email || '',\n          selectedRoleTab,\n          loggedUser.displayName || 'Google User'\n        );\n      }\n"""
          s = s.replace(google_admin, google_safe)
          auth.write_text(s)

          talent = Path('src/context/TalentNetworkContext.tsx')
          t = talent.read_text()
          t = t.replace("const newReqId = `req-${Date.now()}`;\n    const newCampId = `camp-${Date.now()}`;", "const newReqId = `req-${crypto.randomUUID()}`;\n    const newCampId = `camp-${crypto.randomUUID()}`;")
          t = t.replace("      } else if (userData.role === 'employer') {\n        studentsQuery = query(collection(db, 'students'), where('availability', '==', 'actively_seeking'), limit(250));", "      } else if (userData.role === 'employer') {\n        // Employers never subscribe to raw student passports. Visibility is through opportunities.\n        studentsQuery = undefined;")
          t = t.replace("salaryLPA: campaign ? campaign.requirement.salaryMinLPA : 8.5,", "salaryLPA: campaign ? campaign.requirement.salaryMinLPA : 0,")
          t = t.replace("const newStudentId = `stu-indep-${Date.now()}`;", "if (!user?.uid) throw new Error('Authentication is required to register an independent candidate.');\n    const newStudentId = user.uid;")
          t = t.replace("cgpa: candidateData.cgpa || candidateData.independentCredentials.cgpa || 8.5,", "cgpa: candidateData.cgpa || candidateData.independentCredentials.cgpa || 0,")
          t = t.replace("        matchScore: 85,\n        matchBreakdown: {\n          skillMatchScore: 94,\n          academicMatchScore: 92,\n          preferenceMatchScore: 95,\n          aiRationale: `${call.institutionName} verified your programming benchmark and invited you for this high-match campus opportunity.`,\n        },", "        matchScore: Math.max(0, Math.min(99, candidateMatch?.candidateFitScore || 0)),\n        matchBreakdown: {\n          skillMatchScore: candidateMatch?.matchedSkills.length && campaign?.requirement.requiredSkills.length ? Math.round((candidateMatch.matchedSkills.length / campaign.requirement.requiredSkills.length) * 100) : 0,\n          academicMatchScore: student && campaign?.requirement.graduationYears.includes(student.graduationYear) ? 100 : 0,\n          preferenceMatchScore: candidateMatch?.visibilityDenied ? 0 : 100,\n          aiRationale: candidateMatch?.alignmentPoints?.[0] || 'Candidate activated through institutional workflow; human evaluation required.',\n        },")
          talent.write_text(t)
PY

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auth/AuthScreens.tsx src/context/TalentNetworkContext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[automation] harden registration and candidate privacy"
          git push
