name: Repair Candidate Match
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair undefined candidateMatch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/context/TalentNetworkContext.tsx')
          s = p.read_text()
          old = """    const newOpportunities: StudentConsentOpportunity[] = studentIds.map((stuId: string) => {\n      const student = students.find((s) => s.id === stuId);"""
          if old not in s:
              old = """    const newOpportunities: StudentConsentOpportunity[] = studentIds.map((stuId) => {\n      const student = students.find((s) => s.id === stuId);"""
          if old not in s:
              raise SystemExit('target block not found')
          new = """    const campaignMatches = campaign?.requirement\n      ? getStudentMatches(campaign.requirement, students, campaigns)\n      : [];\n\n    const newOpportunities: StudentConsentOpportunity[] = studentIds.map((stuId: string) => {\n      const student = students.find((s) => s.id === stuId);\n      const candidateMatch = campaignMatches.find((m) => m.studentId === stuId);"""
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/TalentNetworkContext.tsx
          git diff --cached --quiet || git commit -m "fix: define candidate match before scoring"
          git push