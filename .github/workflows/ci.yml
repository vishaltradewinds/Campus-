name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firestore rules test harness
        run: npm install --no-save @firebase/rules-unit-testing@5.0.2
      - name: Typecheck
        run: npm run lint
      - name: Matching regression tests
        run: npm test -- tests/matching.test.ts
      - name: Trusted backend regression tests
        run: npm test -- tests/trustedBackend.test.ts
      - name: Commercial regression tests
        run: npm test -- tests/commercial.test.ts
      - name: Production build
        run: npm run build
