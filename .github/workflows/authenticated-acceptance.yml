name: NexusTalent Authenticated Acceptance
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXUSTALENT_EMULATOR_TEST: '1'
      VITE_NEXUSTALENT_EMULATOR_TEST: '1'
      FIREBASE_PROJECT_ID: demo-nexustalent-acceptance
      FIREBASE_DATABASE_ID: '(default)'
      FIREBASE_WEB_API_KEY: demo-key
      NODE_ENV: development
      PORT: '4179'
      AI_MODE: fallback
      TRUST_PROXY_HOPS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npm exec -- playwright install --with-deps chromium
          npm install --global firebase-tools@latest
      - name: Run local authenticated acceptance
        shell: bash
        run: |
          mkdir -p acceptance-evidence
          timeout --kill-after=15s 300s firebase emulators:exec --project demo-nexustalent-acceptance --only auth,firestore --export-on-exit="$RUNNER_TEMP/nexus-synthetic-backup" 'bash -e scripts/run-authenticated-acceptance.sh' 2>&1 | tee acceptance-evidence/emulator-run.log
      - name: Restore synthetic export into fresh emulator processes
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/nexus-synthetic-backup/firebase-export-metadata.json"
          start=$(date +%s)
          timeout --kill-after=15s 180s firebase emulators:exec --project demo-nexustalent-acceptance --only auth,firestore --import="$RUNNER_TEMP/nexus-synthetic-backup" 'node --input-type=module -e "import { verifySyntheticRestore } from \"./tests/syntheticBackup.mjs\"; await verifySyntheticRestore();"' 2>&1 | tee acceptance-evidence/restore-run.log
          echo "restore_and_verify_wall_seconds=$(( $(date +%s) - start ))" | tee acceptance-evidence/restore-duration.txt
      - name: Exercise offline authentication dependency
        shell: bash
        run: bash scripts/run-authenticated-acceptance.sh auth
      - name: Exercise offline datastore with restored Auth only
        shell: bash
        run: |
          timeout --kill-after=15s 100s firebase emulators:exec --project demo-nexustalent-acceptance --only auth --import="$RUNNER_TEMP/nexus-synthetic-backup" 'bash scripts/run-authenticated-acceptance.sh datastore'
      - name: Prepare previously verified version in isolated worktree
        shell: bash
        run: |
          baseline=e1c790abca97c10c0f8ce02a485dec2241307899
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$RUNNER_TEMP/nexus-rollback-baseline" "$baseline"
          npm --prefix "$RUNNER_TEMP/nexus-rollback-baseline" ci
      - name: Verify local application version rollback and reapply
        shell: bash
        run: |
          timeout --kill-after=15s 180s firebase emulators:exec --project demo-nexustalent-acceptance --only auth,firestore --import="$RUNNER_TEMP/nexus-synthetic-backup" 'bash scripts/test-version-rollback.sh' 2>&1 | tee acceptance-evidence/rollback-run.log
      - name: Preserve emulator diagnostics
        if: always()
        run: |
          mkdir -p acceptance-evidence
          for f in firebase-debug.log firestore-debug.log; do
            if [ -f "$f" ]; then cp "$f" acceptance-evidence/; fi
          done
      - name: Upload synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7
