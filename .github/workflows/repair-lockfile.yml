name: One-time npm lockfile repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: synchronize npm lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:main
