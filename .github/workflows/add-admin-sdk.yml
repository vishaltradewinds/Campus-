name: Add Firebase Admin SDK
on:
  push:
    branches: [nexustalent-production-hardening]
permissions:
  contents: write
jobs:
  add-sdk:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: add firebase admin sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install firebase-admin @firebase/rules-unit-testing --save-dev=false
      - name: Commit dependency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: add firebase admin sdk'
          git push
