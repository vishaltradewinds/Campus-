name: NexusTalent Live Staging Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/staging-smoke.yml"
      - "server.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-staging-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public staging health endpoint
        shell: bash
        run: |
          set -u
          url="https://nexustalent-zero-cost-v2.onrender.com/api/health"
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --output /tmp/nexustalent-health.json --write-out '%{http_code}' --max-time 20 "$url" 2>/tmp/nexustalent-curl-error.txt || true)"
            if [ "$status" = "200" ] && node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/nexustalent-health.json","utf8")); if(d.status!=="ok" || typeof d.timestamp!=="string" || Number.isNaN(Date.parse(d.timestamp))) process.exit(1)' 2>/dev/null; then
              echo "HTTP status: $status"
              cat /tmp/nexustalent-health.json
              exit 0
            fi
            echo "Attempt $attempt/18 failed (HTTP ${status:-no response}); retrying in 5 seconds."
            if [ -s /tmp/nexustalent-curl-error.txt ]; then cat /tmp/nexustalent-curl-error.txt; fi
            sleep 5
          done
          echo "Staging health endpoint failed to return HTTP 200 with valid status/timestamp JSON."
          if [ -f /tmp/nexustalent-health.json ]; then cat /tmp/nexustalent-health.json; fi
          exit 1
